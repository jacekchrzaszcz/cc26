<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="966" height="183" viewBox="0 0 966 183" role="img" aria-label="a program before and after a compiler pass">

  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #16181d; }
      .mark { fill: #333a45; }
      .code { fill: #e4e8ee; }
      .caption, .arrow-label { fill: #9aa3b0; }
      .arrow polygon { fill: #272c34; stroke: #8b95a3; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="966" height="183" fill="#ffffff"/>
  <g>
    <text class="code" x="50.4" y="94.4" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">print(input_int() - 10)</text>
  </g>
  <g class="arrow">
    <polygon points="459.2,69.3 562.8,69.3 562.8,48.3 624.4,91.7 562.8,135.1 562.8,114.1 459.2,114.1" fill="#f0f0f0" stroke="#7d7d7d" stroke-width="2.4" stroke-linejoin="round"/>
  </g>
  <g>
    <text class="code" x="680.4" y="53.8" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">_1 = input_int()</text>
    <text class="code" x="680.4" y="94.4" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">_2 = _1 - 10</text>
    <text class="code" x="680.4" y="135.0" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">print(_2)</text>
  </g>
</svg>
