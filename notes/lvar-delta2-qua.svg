<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="966" height="427" viewBox="0 0 966 427" role="img" aria-label="a program before and after a compiler pass">

  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #16181d; }
      .mark { fill: #333a45; }
      .code { fill: #e4e8ee; }
      .caption, .arrow-label { fill: #9aa3b0; }
      .arrow polygon { fill: #272c34; stroke: #8b95a3; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="966" height="427" fill="#ffffff"/>
  <g>
    <text class="code" x="50.4" y="155.3" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">a = input_int()</text>
    <text class="code" x="50.4" y="195.9" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">b = input_int()</text>
    <text class="code" x="50.4" y="236.5" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">a = input_int() + 1</text>
    <text class="code" x="50.4" y="277.1" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">print(b*b - 4*a*c)</text>
  </g>
  <g class="arrow">
    <polygon points="425.6,191.1 529.2,191.1 529.2,170.1 590.8,213.5 529.2,256.9 529.2,235.9 425.6,235.9" fill="#f0f0f0" stroke="#7d7d7d" stroke-width="2.4" stroke-linejoin="round"/>
  </g>
  <g>
    <text class="code" x="646.8" y="53.8" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">a = input_int()</text>
    <text class="code" x="646.8" y="94.4" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">b = input_int()</text>
    <text class="code" x="646.8" y="135.0" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">_1 = input_int()</text>
    <text class="code" x="646.8" y="175.6" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">a = _1 + 1</text>
    <text class="code" x="646.8" y="216.2" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">_2 = b * b</text>
    <text class="code" x="646.8" y="256.8" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">_3 = 4 * a</text>
    <text class="code" x="646.8" y="297.4" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">_4 = _3 * c</text>
    <text class="code" x="646.8" y="338.0" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">_5 = _2 - _4</text>
    <text class="code" x="646.8" y="378.6" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">print(_5)</text>
  </g>
</svg>
