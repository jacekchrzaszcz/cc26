<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="949" height="224" viewBox="0 0 949 224" role="img" aria-label="a program before and after a compiler pass">

  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #16181d; }
      .mark { fill: #333a45; }
      .code { fill: #e4e8ee; }
      .caption, .arrow-label { fill: #9aa3b0; }
      .arrow polygon { fill: #272c34; stroke: #8b95a3; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="949" height="224" fill="#ffffff"/>
  <g>
    <text class="code" x="50.4" y="114.7" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">delta = b*b - 4*a*c</text>
  </g>
  <g class="arrow">
    <polygon points="425.6,89.6 529.2,89.6 529.2,68.6 590.8,112.0 529.2,155.4 529.2,134.4 425.6,134.4" fill="#f0f0f0" stroke="#7d7d7d" stroke-width="2.4" stroke-linejoin="round"/>
  </g>
  <g>
    <text class="code" x="646.8" y="53.8" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">_1 = b * b</text>
    <text class="code" x="646.8" y="94.4" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">_2 = 4 * a</text>
    <text class="code" x="646.8" y="135.0" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">_3 = _2 * c</text>
    <text class="code" x="646.8" y="175.6" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">delta = _1 - _3</text>
  </g>
</svg>
