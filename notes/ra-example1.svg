<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630" role="img" aria-label="a program before and after a compiler pass">

  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #16181d; }
      .mark { fill: #333a45; }
      .code { fill: #e4e8ee; }
      .caption, .arrow-label { fill: #9aa3b0; }
      .arrow polygon { fill: #272c34; stroke: #8b95a3; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="1100" height="630" fill="#ffffff"/>
  <g>
    <text class="code" x="50.4" y="317.7" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">print(input_int() - 10)</text>
  </g>
  <g class="arrow">
    <polygon points="459.2,292.6 562.8,292.6 562.8,271.6 624.4,315.0 562.8,358.4 562.8,337.4 459.2,337.4" fill="#f0f0f0" stroke="#7d7d7d" stroke-width="2.4" stroke-linejoin="round"/>
  </g>
  <g>
    <text class="code" x="680.4" y="53.8" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">      .globl main</text>
    <text class="code" x="680.4" y="94.4" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">main:</text>
    <text class="code" x="680.4" y="135.0" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">       pushq %rbp</text>
    <text class="code" x="680.4" y="175.6" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">       movq %rsp, %rbp</text>
    <text class="code" x="680.4" y="216.2" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">       callq input_int</text>
    <text class="code" x="680.4" y="256.8" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">       movq %rax, %rcx</text>
    <text class="code" x="680.4" y="297.4" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">       subq $10, %rcx</text>
    <text class="code" x="680.4" y="338.0" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">       movq %rcx, %rdi</text>
    <text class="code" x="680.4" y="378.6" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">       callq print_int</text>
    <text class="code" x="680.4" y="419.2" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">       movq $0, %rax</text>
    <text class="code" x="680.4" y="459.8" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">       popq %rbp</text>
    <text class="code" x="680.4" y="500.4" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">       retq </text>
    <text class="code" x="680.4" y="541.0" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve"></text>
    <text class="code" x="680.4" y="581.6" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="28.0" fill="#1c1f24" xml:space="preserve">    </text>
  </g>
