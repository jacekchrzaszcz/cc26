<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="561" height="584" viewBox="0 0 561 584" role="img" aria-label="the control-flow graph of the factorial loop, with the two edges that meet at block L1 marked, and the use of i in L1 that they disagree about">

  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #16181d; }
      .edge line, .edge path { stroke: #8b95a3; }
      .edge polygon { fill: #8b95a3; }
      .edge.mark line, .edge.mark path { stroke: #ff9a8d; }
      .edge.mark polygon { fill: #ff9a8d; }
      .edge.mark2 line, .edge.mark2 path { stroke: #8bb8ea; }
      .edge.mark2 polygon { fill: #8bb8ea; }
      .block rect { fill: #272c34; stroke: #8b95a3; }
      .block text { fill: #e4e8ee; }
      .block tspan.mark { fill: #ff9a8d; }
      .block tspan.mark2 { fill: #8bb8ea; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="561" height="584" fill="#ffffff"/>
  <g class="edge mark">
    <line x1="280.5" y1="173.8" x2="280.5" y2="180.0" stroke="#b3261e" stroke-width="3.3" stroke-linecap="round"/>
    <polygon points="280.5,195.8 270.4,180.0 290.6,180.0" fill="#b3261e"/>
  </g>
  <g class="edge">
    <line x1="280.5" y1="297.0" x2="280.5" y2="303.2" stroke="#7d7d7d" stroke-width="2.4" stroke-linecap="round"/>
    <polygon points="280.5,319.0 270.4,303.2 290.6,303.2" fill="#7d7d7d"/>
  </g>
  <g class="edge">
    <path d="M 77.0 246.4 L 46.2 246.4 Q 30.8 246.4 30.8 261.8 L 30.8 525.2 Q 30.8 540.6 46.2 540.6 L 160.2 540.6" fill="none" stroke="#7d7d7d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="176.0,540.6 160.2,550.8 160.2,530.5" fill="#7d7d7d"/>
  </g>
  <g class="edge mark">
    <path d="M 365.2 401.5 L 514.8 401.5 Q 530.2 401.5 530.2 386.1 L 530.2 261.8 Q 530.2 246.4 514.8 246.4 L 499.8 246.4" fill="none" stroke="#b3261e" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="484.0,246.4 499.8,236.3 499.8,256.5" fill="#b3261e"/>
  </g>
  <g class="block">
    <rect x="202.4" y="15.4" width="156.2" height="151.8" rx="6.6" fill="#f0f0f0" stroke="#7d7d7d" stroke-width="2.2"/>
    <text x="221.1" y="52.4" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="22.0" fill="#1c1f24" xml:space="preserve">entry:</text>
    <text x="221.1" y="84.3" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="22.0" fill="#1c1f24" xml:space="preserve">  i = n</text>
    <text x="221.1" y="116.2" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="22.0" fill="#1c1f24" xml:space="preserve">  r = 1</text>
    <text x="221.1" y="148.1" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="22.0" fill="#1c1f24" xml:space="preserve">  goto L1</text>
  </g>
  <g class="block">
    <rect x="83.6" y="202.4" width="393.8" height="88.0" rx="6.6" fill="#f0f0f0" stroke="#7d7d7d" stroke-width="2.2"/>
    <text x="102.3" y="239.4" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="22.0" fill="#1c1f24" xml:space="preserve">L1:</text>
    <text x="102.3" y="271.3" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="22.0" fill="#1c1f24" xml:space="preserve">  if <tspan class="mark" fill="#b3261e">i</tspan> &lt;= 1 goto L3 else L2</text>
  </g>
  <g class="block">
    <rect x="202.4" y="325.6" width="156.2" height="151.8" rx="6.6" fill="#f0f0f0" stroke="#7d7d7d" stroke-width="2.2"/>
    <text x="221.1" y="362.6" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="22.0" fill="#1c1f24" xml:space="preserve">L2:</text>
    <text x="221.1" y="394.5" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="22.0" fill="#1c1f24" xml:space="preserve">  i = i-1</text>
    <text x="221.1" y="426.4" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="22.0" fill="#1c1f24" xml:space="preserve">  r = r*i</text>
    <text x="221.1" y="458.3" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="22.0" fill="#1c1f24" xml:space="preserve">  goto L1</text>
  </g>
  <g class="block">
    <rect x="182.6" y="512.6" width="195.8" height="56.1" rx="6.6" fill="#f0f0f0" stroke="#7d7d7d" stroke-width="2.2"/>
    <text x="201.3" y="549.6" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="22.0" fill="#1c1f24" xml:space="preserve">L3: return r</text>
  </g>
</svg>
